<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zygfred · FM drums</title>
<style>
  :root {
    --accent: #ff965a;
    --chan-r: #6ac8ff;
    --idle: #a5aab9;
    --dim: #5f6278;
    --faint: #464a5e;
    --bg: #0d0b11;
    --panel: #151219;
    --inset: #0a080d;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--idle);
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px 40px;
    user-select: none;
    -webkit-user-select: none;
  }
  h1 {
    color: var(--accent);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    margin-bottom: 36px;
  }
  h1 .sub { color: var(--faint); font-weight: 400; letter-spacing: 1px; }
  #voices {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .voice {
    background: var(--panel);
    border-radius: 16px;
    padding: 22px 20px 20px;
    width: 282px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: box-shadow 0.25s ease-out;
  }
  .voice.hit { animation: flash 0.25s ease-out; }
  @keyframes flash {
    0% { box-shadow: 0 0 0 1px rgba(255, 150, 90, 0.35), 0 0 24px rgba(255, 150, 90, 0.18); }
    100% { box-shadow: none; }
  }
  .pad {
    background: rgba(255, 150, 90, 0.07);
    border: none;
    border-radius: 9px;
    color: var(--accent);
    font: inherit;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 11px;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .pad:hover { background: rgba(255, 150, 90, 0.11); }
  .pad:active { background: rgba(255, 150, 90, 0.18); }
  .pad .key { color: var(--dim); font-weight: 400; letter-spacing: 0; margin-left: 8px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .label { width: 52px; color: var(--dim); flex: none; }
  .row .val { width: 46px; text-align: right; color: var(--idle); flex: none; }
  .bar {
    flex: 1;
    height: 13px;
    border-radius: 3px;
    background: repeating-linear-gradient(90deg, #221e2b 0 6px, transparent 6px 8px);
    cursor: ew-resize;
    touch-action: none;
    overflow: hidden;
    position: relative;
  }
  .fill {
    height: 100%;
    background: repeating-linear-gradient(90deg, var(--accent) 0 6px, transparent 6px 8px);
    pointer-events: none;
  }
  .tick {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    margin-left: -1px;
    opacity: 0;
    pointer-events: none;
  }
  .tick-l { background: #fff; }
  .tick-r { background: var(--chan-r); }
  .scope {
    width: 100%;
    height: 58px;
    background: var(--inset);
    border: none;
    border-radius: 8px;
    margin: 8px 0;
  }
  #master {
    display: flex;
    gap: 8px 32px;
    flex-wrap: wrap;
    justify-content: center;
    background: var(--panel);
    border-radius: 16px;
    padding: 18px 26px;
    margin-top: 20px;
    width: min(886px, 100%);
  }
  #master .row { flex: 1; min-width: 210px; }
  #midi {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--panel);
    border-radius: 12px;
    padding: 10px 20px;
    margin-top: 10px;
    width: min(886px, 100%);
    font-size: 12px;
    color: var(--dim);
  }
  #midi .tag { color: var(--faint); letter-spacing: 2px; }
  #midi select {
    background: var(--inset);
    color: var(--idle);
    border: none;
    border-radius: 6px;
    font: inherit;
    padding: 4px 8px;
    cursor: pointer;
  }
  #midi .learn {
    background: rgba(255, 150, 90, 0.07);
    border: none;
    border-radius: 6px;
    color: var(--dim);
    font: inherit;
    letter-spacing: 1px;
    padding: 4px 14px;
    cursor: pointer;
  }
  #midi .learn:hover { color: var(--idle); }
  #midi .learn.on { color: var(--accent); background: rgba(255, 150, 90, 0.16); }
  #midi .learn:disabled { opacity: 0.4; cursor: default; }
  #midi .status { flex: 1; text-align: right; }
  #midi .status.accent { color: var(--accent); }
  .bar.armed { box-shadow: 0 0 0 1px var(--accent); }
  footer { color: var(--faint); font-size: 12px; margin-top: 26px; text-align: center; }
  footer .l { color: #cdd2e0; }
  footer .r { color: var(--chan-r); }
  #power {
    position: fixed;
    inset: 0;
    background: rgba(13, 11, 17, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 10;
  }
  #power button {
    background: rgba(255, 150, 90, 0.09);
    border: none;
    border-radius: 10px;
    color: var(--accent);
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 16px 42px;
    cursor: pointer;
  }
  #power button:hover { background: rgba(255, 150, 90, 0.15); }
  #power .hint { color: var(--faint); }
</style>
</head>
<body>
  <h1>&#9670; zygfred <span class="sub">&#183; FM drums</span></h1>
  <div id="voices"></div>
  <div id="master"></div>
  <div id="midi"></div>
  <footer>a / s / d trigger &#183; click pads &#183; drag or scroll the bars &#183; <span class="l">white</span>/<span class="r">blue</span> ticks = where L/R landed on the last hit (Rand)</footer>
  <div id="power">
    <button>&#9670; power on</button>
    <div class="hint">browsers need a click before audio can start</div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
